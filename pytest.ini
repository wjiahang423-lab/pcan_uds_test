[pytest]
testpaths = tests
addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
    -p no:randomly

markers =
    session_ctrl:   DiagnosticSessionControl (0x10)
    ecu_reset:      ECUReset (0x11)
    rdbi:           ReadDataByIdentifier (0x22)
    security:       SecurityAccess (0x27)
    dtc:            DTC 相关 (0x14 / 0x19)
    routine:        RoutineControl (0x31)
    negative:       负响应验证用例
